trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: UseNode@1
  inputs:
    version: '20.x'

- script: npm ci
  displayName: 'Install playwright dependencies'

- script: npx playwright install --with-deps
  displayName: 'Install Playwright Browsers'

- script: npx playwright test
  env:
    SECRET_KEY: $(SECRET_KEY)
    USER_NAME: $(USER_NAME)
    PASSWORD: $(PASSWORD)